# ============================================================
# ロイロノート 提出箱チェッカー 設定ファイル
# ============================================================

# --- ログイン情報 ---
# ロイロノートの学校ID・ユーザー名・パスワードを設定してください
login:
  school_id: ""        # 学校ID
  username: ""         # ユーザー名（教員アカウント）
  password: ""         # パスワード

# --- チェック対象の授業・提出箱 ---
# 教科名と、チェックしたい提出箱名のリストを設定します
# 提出箱名を空リスト [] にすると、その授業の全提出箱をチェックします
targets:
  - subject: "数学"
    class_name: "1年A組"
    submission_boxes: []       # 空 = 全提出箱をチェック
  - subject: "英語"
    class_name: "1年A組"
    submission_boxes:
      - "Unit1 単語テスト"
      - "Unit2 ワークシート"

# --- 出力設定 ---
output:
  # 出力形式: "console" (ターミナル表示), "excel" (Excelファイル出力), "both" (両方)
  format: "both"
  # Excel出力先ファイルパス
  excel_path: "未提出者一覧.xlsx"

# --- ブラウザ設定 ---
browser:
  # ヘッドレスモード (true: ブラウザ非表示, false: ブラウザ表示)
  headless: false
  # ページ読み込みの待機時間（秒）
  wait_timeout: 15
  # chromedriver のパス (空欄の場合は自動検出)
  chromedriver_path: ""

# --- Excelファイル処理モード ---
# ロイロノートからダウンロード済みのExcelファイルを直接処理する場合に使用
# この設定を使う場合は main.py --excel-mode で実行してください
excel_mode:
  # ダウンロード済みExcelファイルのディレクトリ
  input_dir: "./downloads"
  # ファイルと教科の対応（ファイル名の一部 → 教科名）
  file_subject_map:
    "1年A組_数学": "数学"
    "1年A組_英語": "英語"
