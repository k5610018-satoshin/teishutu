# ============================================================
# ロイロノート 提出箱チェッカー 設定ファイル
# ============================================================

# --- ログイン情報 ---
# 設定すると自動ログインを試みます。
# 空欄の場合はブラウザが開いた後、手動でログインしてください。
login:
  school_id: ""        # 学校ID
  username: ""         # ユーザー名（教員アカウント）
  password: ""         # パスワード

# --- チェック対象の授業 ---
# ロイロノートのクラスページURLと教科名を設定してください。
# URLはブラウザでクラスを開いたときのアドレスバーからコピーします。
#   例: https://loilonote.app/_/10708295
targets:
  - subject: "情報"
    url: "https://loilonote.app/_/10708295"
#  - subject: "数学"
#    url: "https://loilonote.app/_/XXXXXXXX"
#  - subject: "英語"
#    url: "https://loilonote.app/_/YYYYYYYY"

# --- 出力設定 ---
output:
  # "console" (ターミナル表示), "excel" (Excelファイル), "both" (両方)
  format: "both"
  excel_path: "未提出者一覧.xlsx"

# --- ブラウザ設定 ---
browser:
  headless: false       # false: ブラウザ表示, true: 非表示
  wait_timeout: 20      # ページ読み込み待機秒数
  chromedriver_path: "" # 空欄で自動検出

# --- デバッグ ---
# true にすると page_structure.json にページのDOM構造を出力します
# セレクタ調整時に使用してください
debug: false

# --- Excelファイル処理モード ---
# python main.py --excel-mode で使用
excel_mode:
  input_dir: "./downloads"
  file_subject_map:
    "数学": "数学"
    "英語": "英語"
